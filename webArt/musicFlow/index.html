<!DOCTYPE html>
<html lang="es">
  <head>  
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
    <title>Web Art: Music flow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <style> 
      html,body{ 
        background-color: #333; 
        -webkit-user-select: none;  
        -khtml-user-select: none;  
          -moz-user-select: none;  
            -ms-user-select: none;  
                user-select: none; 
        -webkit-tap-highlight-color: transparent; 
        color: #DDD;  
        margin: 0; 
        padding: 0;  
      }          
      #btnPlay {    
        position: absolute;
        top: 20px;
        margin: 0; 
        padding: 0;     
        left: calc(100% - 40px);   
        cursor: pointer;
        transition: all 0.5s ease-out; 
      }  
      #watch {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 2;
      }
      #watch svg {
        width: min(36vw, 320px);
        height: min(36vw, 320px);
        max-width: 320px;
        max-height: 320px;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.25));
      }
    </style>
  </head>
  <body> 
    <div id="btnPlay"></div>
    <div id="watch"></div>
    <div id="visualizer"></div>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script> 
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
      var mic = { 
        audioContext: null,
        analyzer: null,
        dataArray: null, 
        exe: false,
        configMic: async function(){
          //Init listenerMic
          try { 
           // Solicitar acceso al micrófono
           var stream = await navigator.mediaDevices.getUserMedia({ 
             audio: true 
           });                
           // Configurar el contexto de audio
           this.audioContext = new (window.AudioContext||window.webkitAudioContext)();
           var source = this.audioContext.createMediaStreamSource(stream);              
           // Configurar el analizador de frecuencia
           this.analyzer = this.audioContext.createAnalyser();
           this.analyzer.fftSize = 1024*1; // Mayor FFT = más barras detalladas
           var bufferLength = this.analyzer.frequencyBinCount;
           this.dataArray = new Uint8Array(bufferLength);
           source.connect(this.analyzer);  
         } catch (error) {
           console.error(error);
           alert("Error al acceder al micrófono.");
         }
        }, 
        stop: function(){ 
          this.exe=false;
        },
        start: function(fn){
          var self = this;
          self.stop(); 
          self.exe=true; 

          function exe(){  
            self.analyzer.getByteFrequencyData(self.dataArray); 
            var avgVolume = self.dataArray.reduce(function(acc, val){
              return acc + val;
            },0);
            avgVolume = avgVolume/self.dataArray.length; 

            if(typeof fn === 'function'){ 
              fn(avgVolume);
            }
            if(self.exe){
              requestAnimationFrame(exe);
            }
          }
          exe();
        }
      } 
      
      var ploter = { 
        radioInicial: 5, 
        circulos: [],
        getRandomInt: function (min, max){ 
          return Math.floor(Math.random() * (max - min + 1) ) + min;
        },
        init: function(){ 
          $('#visualizer').html(' ');
          this.circulos=[]; 
          // Configuración inicial
          var w = window.innerWidth-4;
          var h = window.innerHeight-4; 

          // Crear el elemento SVG
          var svg = d3.select("#visualizer").append("svg");
          svg.attr("width", w);
          svg.attr("height", h);
    
          // Crear círculos
          for(var i=0; i<w; i++){
            for(var ii=0; ii<h; ii++){
              if(Math.random()<0.000015){  
                var circulo = svg.append("circle")
                circulo.attr("cx", i);
                circulo.attr("cy", ii);
                circulo.attr("r", this.getRandomInt(1,this.radioInicial));
                circulo.attr("fill", "#DDD"); 
                this.circulos.push(circulo); 
              }
            }
          }             
        },
        update: function(valor){
          var nuevoRadio = valor;
          for (var i=0; i<this.circulos.length; i++){
            this.circulos[i].transition().duration(50).attr("r", nuevoRadio);
          }
        }
      }
      
      var watch = {
        size: 400,
        init: function(){
          var container = d3.select('#watch');
          container.html('');

          var svg = container.append('svg')
            .attr('viewBox', '0 0 ' + this.size + ' ' + this.size)
            .attr('preserveAspectRatio', 'xMidYMid meet');

          var clock = svg.append('g')
            .attr('transform', 'translate(' + (this.size/2) + ',' + (this.size/2) + ')');

          clock.append('circle')
            .attr('r', this.size * 0.46)
            .attr('fill', '#333')
            .attr('stroke', 'rgba(255,255,255,0.75)')
            .attr('stroke-width', 2);

          for (var i = 0; i < 60; i++) {
            var angle = (i * 6 - 90) * Math.PI / 180;
            var tickOuter = this.size * 0.45;
            var tickInner = i % 5 === 0 ? this.size * 0.41 : this.size * 0.43;

            clock.append('line')
              .attr('x1', Math.cos(angle) * tickInner)
              .attr('y1', Math.sin(angle) * tickInner)
              .attr('x2', Math.cos(angle) * tickOuter)
              .attr('y2', Math.sin(angle) * tickOuter)
              .attr('stroke', i % 5 === 0 ? '#f4f4f4' : 'rgba(255,255,255,1)')
              .attr('stroke-width', i % 5 === 0 ? 2 : 1)
              .attr('stroke-linecap', 'round');
          }

          for (var i = 1; i <= 12; i++) {
            var numberAngle = (i * 30 - 90) * Math.PI / 180;
            var radius = this.size * 0.375;

            clock.append('text')
              .attr('x', Math.cos(numberAngle) * radius)
              .attr('y', Math.sin(numberAngle) * radius + 6)
              .attr('text-anchor', 'middle')
              .attr('fill', '#ddd')
              .style('font-size', '18px')
              .style('font-weight', '600')
              .text(i);
          }

          this.hourHand = clock.append('line')
            .attr('stroke', '#ffffff')
            .attr('stroke-width', 7)
            .attr('stroke-linecap', 'round');

          this.minuteHand = clock.append('line')
            .attr('stroke', '#ffffff')
            .attr('stroke-width', 5)
            .attr('stroke-linecap', 'round');

          this.secondHand = clock.append('line')
            .attr('stroke', '#7dd3fc')
            .attr('stroke-width', 3)
            .attr('stroke-linecap', 'round');

          clock.append('circle')
            .attr('r', 9)
            .attr('fill', '#ffffff')
            .attr('stroke', '#333333')
            .attr('stroke-width', 2);

          this.update();
          requestAnimationFrame(this.update.bind(this));
        },
        update: function(){
          var now = new Date();
          var seconds = now.getSeconds() + (now.getMilliseconds() / 1000);
          var minutes = now.getMinutes() + (seconds / 60);
          var hours = (now.getHours() % 12) + (minutes / 60);

          var radius = this.size / 2;
          var secondAngle = (seconds / 60 * 360 - 90) * Math.PI / 180;
          var minuteAngle = (minutes / 60 * 360 - 90) * Math.PI / 180;
          var hourAngle = (hours / 12 * 360 - 90) * Math.PI / 180; 

          this.secondHand
            .attr('x1', 0)
            .attr('y1', 0)
            .attr('x2', Math.cos(secondAngle) * (radius * 0.7))
            .attr('y2', Math.sin(secondAngle) * (radius * 0.7));

          this.minuteHand
            .attr('x1', 0)
            .attr('y1', 0)
            .attr('x2', Math.cos(minuteAngle) * (radius * 0.65))
            .attr('y2', Math.sin(minuteAngle) * (radius * 0.65));

          this.hourHand
            .attr('x1', 0)
            .attr('y1', 0)
            .attr('x2', Math.cos(hourAngle) * (radius * 0.45))
            .attr('y2', Math.sin(hourAngle) * (radius * 0.45));

          requestAnimationFrame(this.update.bind(this));
        }
      };

      var app = { 
        btnPlay: function(){ 
          $('#btnPlay').html('<i class="fas fa-play fa-2x"></i>');
          $('#btnPlay').removeClass('on');
          $('#btnPlay').addClass('off');
        }, 
        btnStop: function(){
          $('#btnPlay').html('<i class="fas fa-stop fa-2x"></i>');
          $('#btnPlay').removeClass('off');
          $('#btnPlay').addClass('on'); 
        }, 
        init: function(){  
          mic.configMic();  
          app.btnPlay();  
          mic.stop();     
          ploter.init(); 
          watch.init();           

          $('#btnPlay').on('click',function(){
            if ($(this).hasClass('off')) {    
              app.btnStop();
              mic.start(function(vol){ 
                ploter.update(vol);
              }); 
            }else{   
              app.btnPlay();
              mic.stop(); 
              ploter.init();  
            }
          }); 

          $(window).off('resize');
          $(window).on('resize',function(){  
            app.btnPlay();
            mic.stop();
            ploter.init();     
          });
        }
      }
      app.init();

    </script> 
  </body>
</html>
