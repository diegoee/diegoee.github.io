<!DOCTYPE html>
<html lang="es">
  <head>  
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
    <title>Webapp: Audio Spectrum</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #333;
        color: #DDD;
        font-family: Arial, sans-serif;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #spectrogram {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      #frequencyMarker {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }
      .toolbar {
        position: fixed;
        z-index: 1;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 22px;
        background: linear-gradient(180deg, rgba(33, 33, 33, .88), rgba(33, 33, 33, 0));
      }
      .heading { min-width: 0; }
      h1 {
        margin: 0 0 5px;
        font-size: clamp(1rem, 3vw, 1.35rem);
        letter-spacing: .04em;
      }
      #status {
        margin: 0;
        color: #c4c4c4;
        font-size: .85rem;
      }
      #frequencyReadout {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      #levelLegend {
        position: fixed;
        z-index: 1;
        left: 18px;
        bottom: 24px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 5px;
        background: rgba(33, 33, 33, .88);
        color: #DDD;
        font-size: .75rem;
      }
      #levelLegend[hidden] { display: none; }
      .legend-title { display: block; margin-bottom: 7px; }
      .legend-scale { display: flex; align-items: stretch; gap: 7px; height: 130px; }
      #levelGradient {
        width: 14px;
        height: 100%;
        border: 1px solid rgba(255,255,255,.25);
      }
      .legend-labels {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 7ch;
        line-height: 1;
      }
      #micButton {
        position: fixed;
        z-index: 3;
        right: 22px;
        bottom: 22px;
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        padding: 0;
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 50%;
        background: rgba(0,0,0,.35);
        color: #DDD;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0,0,0,.4);
        transition: background .2s ease, border-color .2s ease, color .2s ease, opacity .2s ease, transform .2s ease;
      }
      #micButton:hover:not(:disabled) { transform: translateY(-2px); background: rgba(0,0,0,.7); }
      #micButton:focus-visible { outline: 2px solid #DDD; outline-offset: 4px; }
      #micButton:disabled { cursor: wait; opacity: .7; }
      #micButton[aria-pressed="true"] {
        border-color: #61d39a;
        background: #153b2c;
        color: #8cf0b8;
      }
      #micButton svg { width: 28px; height: 28px; }
      #micButton .mic-on-icon { display: none; }
      #micButton[aria-pressed="true"] .mic-on-icon { display: block; }
      #micButton[aria-pressed="true"] .mic-off-icon { display: none; }
      .toolbar-actions {
        position: relative;
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
      }
      .toolbar-actions button {
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid rgba(255,255,255,.35);
        border-radius: 5px;
        background: rgba(0,0,0,.35);
        color: #DDD;
        font: inherit;
        cursor: pointer;
      }
      .toolbar-actions button:hover:not(:disabled) { background: rgba(0,0,0,.55); }
      .toolbar-actions button:focus-visible { outline: 2px solid #DDD; outline-offset: 3px; }
      .toolbar-actions button:disabled { cursor: not-allowed; opacity: .5; }
      #settingsMenu {
        position: absolute;
        z-index: 5;
        top: calc(100% + 8px);
        right: 0;
        width: min(280px, 86vw);
        padding: 14px;
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 5px;
        background: #292929;
        box-shadow: 0 8px 24px rgba(0,0,0,.4);
        color: #DDD;
      }
      #settingsMenu[hidden] { display: none; }
      #settingsMenu label { display: block; margin-bottom: 12px; font-size: .9rem; }
      #modeButton {
        width: 100%;
        margin-bottom: 14px;
        text-align: left;
      }
      .settings-menu-section { padding-top: 12px; border-top: 1px solid rgba(255,255,255,.18); }
      #minDbRange { width: 100%; accent-color: #DDD; }
      .db-range-labels {
        display: flex;
        justify-content: space-between;
        color: #c4c4c4;
        font-size: .75rem;
      }
      #minDbValue {
        display: inline-block;
        width: 7ch;
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      } 
      @media (max-width: 940px) {
        .toolbar { align-items: flex-start; padding: 14px; gap: 10px; }
        #status { max-width: 54vw; line-height: 1.35; }
        .toolbar-actions { flex-direction: column; align-items: stretch; max-width: 64vw; }
        .toolbar-actions button { min-height: 40px; padding: 0 10px; font-size: .8rem; }
      }
    </style>
  </head>
  <body>
    <canvas id="spectrogram" aria-label="Espectrograma de audio en tiempo real"></canvas>
    <canvas id="frequencyMarker" aria-hidden="true"></canvas>
    <header class="toolbar">
      <div class="heading">
        <h1>Audio Spectrum</h1>
        <p id="status" role="status" aria-live="polite">Pulsa el botón para activar el micrófono.</p>
      </div>
      <div class="toolbar-actions">
        <p id="frequencyReadout" aria-live="off">Frecuencia predominante: --</p>
        <button id="settingsMenuButton" type="button" aria-label="Abrir opciones de vista y escala" aria-expanded="false" aria-controls="settingsMenu" title="Opciones de vista y escala">☰</button>
        <div id="settingsMenu" role="group" aria-label="Opciones de vista y escala" hidden>
          <button id="modeButton" type="button" aria-pressed="false" title="Cambiar entre vista temporal y espectro por frecuencia">Vista: tiempo</button>
          <div class="settings-menu-section">
            <label for="minDbRange">Mínimo de escala: <output id="minDbValue" for="minDbRange">-100 dB</output></label>
            <input id="minDbRange" type="range" min="-120" max="-31" step="1" value="-100">
            <div class="db-range-labels"><span>-120 dB</span><span>-31 dB</span></div>
          </div>
        </div>
      </div>
    </header>
    <button id="micButton" type="button" aria-label="Activar micrófono" aria-pressed="false" title="Activar micrófono">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="mic-on-icon">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"></path>
        </g>
        <g class="mic-off-icon">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8M3 3l18 18"></path>
        </g>
      </svg>
    </button>
    <div id="levelLegend" aria-label="Leyenda de intensidad del espectrograma">
      <span class="legend-title">Intensidad</span>
      <div class="legend-scale">
        <canvas id="levelGradient" width="1" height="256" aria-hidden="true"></canvas>
        <div class="legend-labels" aria-hidden="true">
          <span id="legendMax">-30 dB</span>
          <span id="legendTickOne">-53 dB</span>
          <span id="legendTickTwo">-77 dB</span>
          <span id="legendMin">-100 dB</span>
        </div>
      </div>
    </div> 
    <script>
      (function() {
        var canvas = document.getElementById('spectrogram');
        var context = canvas.getContext('2d', { alpha: false });
        var timeCanvas = document.createElement('canvas');
        var timeContext = timeCanvas.getContext('2d', { alpha: false });
        var markerCanvas = document.getElementById('frequencyMarker');
        var markerContext = markerCanvas.getContext('2d');
        var button = document.getElementById('micButton');
        var modeButton = document.getElementById('modeButton');
        var settingsMenuButton = document.getElementById('settingsMenuButton');
        var settingsMenu = document.getElementById('settingsMenu');
        var minDbRange = document.getElementById('minDbRange');
        var minDbValue = document.getElementById('minDbValue');
        var status = document.getElementById('status');
        var frequencyReadout = document.getElementById('frequencyReadout');
        var levelLegend = document.getElementById('levelLegend');
        var levelGradient = document.getElementById('levelGradient');
        var legendMax = document.getElementById('legendMax');
        var legendTickOne = document.getElementById('legendTickOne');
        var legendTickTwo = document.getElementById('legendTickTwo');
        var legendMin = document.getElementById('legendMin');
        var audioContext = null;
        var analyser = null;
        var microphoneStream = null;
        var frequencyData = null;
        var animationFrame = null;
        var column = null;
        var pixelRatio = 1;
        var lastFrequencyUpdate = 0;
        var colorMap = createColorMap();
        var isRunning = false;
        var isFrequencyView = false;
        var minDecibels = -100;
        var maxDecibels = -30;

        function updateDecibelScale() {
          var range = maxDecibels - minDecibels;
          var firstTick = Math.round(maxDecibels - range / 3);
          var secondTick = Math.round(maxDecibels - range * 2 / 3);
          minDbValue.value = minDecibels + ' dB';
          minDbValue.textContent = minDecibels + ' dB';
          legendMax.textContent = maxDecibels + ' dB';
          legendTickOne.textContent = firstTick + ' dB';
          legendTickTwo.textContent = secondTick + ' dB';
          legendMin.textContent = minDecibels + ' dB';
          if (analyser) analyser.minDecibels = minDecibels;
        }

        function drawLevelLegend() {
          var legendContext = levelGradient.getContext('2d');
          var image = legendContext.createImageData(1, 256);
          for (var i = 0; i < 256; i++) {
            var colorOffset = i * 4;
            var pixelOffset = (255 - i) * 4;
            image.data[pixelOffset] = colorMap[colorOffset];
            image.data[pixelOffset + 1] = colorMap[colorOffset + 1];
            image.data[pixelOffset + 2] = colorMap[colorOffset + 2];
            image.data[pixelOffset + 3] = 255;
          }
          legendContext.putImageData(image, 0, 0);
        }

        function createColorMap() {
          var colors = new Uint8ClampedArray(256 * 4);
          for (var i = 0; i < 256; i++) {
            var hue = 240 - (i / 255) * 240;
            var saturation = 0.95;
            var lightness = i < 18 ? 0.025 : 0.12 + (i / 255) * 0.48;
            var chroma = (1 - Math.abs(2 * lightness - 1)) * saturation;
            var x = chroma * (1 - Math.abs((hue / 60) % 2 - 1));
            var rgb = hue < 60 ? [chroma, x, 0] : hue < 120 ? [x, chroma, 0] :
              hue < 180 ? [0, chroma, x] : hue < 240 ? [0, x, chroma] :
              hue < 300 ? [x, 0, chroma] : [chroma, 0, x];
            var match = lightness - chroma / 2;
            var offset = i * 4;
            colors[offset] = (rgb[0] + match) * 255;
            colors[offset + 1] = (rgb[1] + match) * 255;
            colors[offset + 2] = (rgb[2] + match) * 255;
            colors[offset + 3] = 255;
          }
          return colors;
        }

        function resizeCanvas() {
          pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          var width = Math.max(1, Math.floor(window.innerWidth * pixelRatio));
          var height = Math.max(1, Math.floor(window.innerHeight * pixelRatio));
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            timeCanvas.width = width;
            timeCanvas.height = height;
            markerCanvas.width = width;
            markerCanvas.height = height;
            context.fillStyle = '#333';
            context.fillRect(0, 0, width, height);
            timeContext.fillStyle = '#333';
            timeContext.fillRect(0, 0, width, height);
            column = context.createImageData(1, height);
          }
        }

        function drawSpectrogram() {
          if (!isRunning || !analyser) return;
          analyser.getByteFrequencyData(frequencyData);

          var width = canvas.width;
          var height = canvas.height;
          var sampleRate = audioContext.sampleRate;
          var binWidth = sampleRate / analyser.fftSize;
          var minFrequency = 35;
          var maxFrequency = Math.min(16000, sampleRate / 2);
          var peakBin = 0;
          var peakLevel = 0;

          for (var i = 1; i < frequencyData.length; i++) {
            var binFrequency = i * binWidth;
            if (binFrequency >= minFrequency && binFrequency <= maxFrequency && frequencyData[i] > peakLevel) {
              peakLevel = frequencyData[i];
              peakBin = i;
            }
          }

          if (width > 1) {
            timeContext.drawImage(timeCanvas, 1, 0, width - 1, height, 0, 0, width - 1, height);
          }

          for (var y = 0; y < height; y++) {
            var proportion = y / Math.max(1, height - 1);
            var frequency = maxFrequency * Math.pow(minFrequency / maxFrequency, proportion);
            var bin = Math.min(frequencyData.length - 1, Math.max(0, Math.round(frequency / binWidth)));
            var colorOffset = frequencyData[bin] * 4;
            var pixelOffset = y * 4;
            column.data[pixelOffset] = colorMap[colorOffset];
            column.data[pixelOffset + 1] = colorMap[colorOffset + 1];
            column.data[pixelOffset + 2] = colorMap[colorOffset + 2];
            column.data[pixelOffset + 3] = 255;
          }
          timeContext.putImageData(column, width - 1, 0);
          drawFrequencyScale(timeContext, height, maxFrequency, minFrequency);

          if (isFrequencyView) {
            drawFrequencySpectrum(width, height, minFrequency, maxFrequency, binWidth);
            drawDominantFrequencyMarker(peakBin * binWidth, peakLevel, minFrequency, maxFrequency, width, height);
            updateFrequencyReadout(peakBin * binWidth, peakLevel);
            animationFrame = requestAnimationFrame(drawSpectrogram);
            return;
          }

          context.drawImage(timeCanvas, 0, 0);
          drawDominantFrequencyMarker(peakBin * binWidth, peakLevel, minFrequency, maxFrequency, width, height);
          updateFrequencyReadout(peakBin * binWidth, peakLevel);
          animationFrame = requestAnimationFrame(drawSpectrogram);
        }

        function drawDominantFrequencyMarker(frequency, level, minFrequency, maxFrequency, width, height) {
          markerContext.clearRect(0, 0, width, height);
          if (level < 35 || frequency < minFrequency || frequency > maxFrequency) return;

          var markerColor = isFrequencyView ? '#7dd3fc' : '#ffffff';
          markerContext.save();
          markerContext.strokeStyle = markerColor;
          markerContext.fillStyle = markerColor;
          markerContext.lineWidth = Math.max(1.5, 2 * pixelRatio);
          markerContext.setLineDash([6 * pixelRatio, 4 * pixelRatio]);
          markerContext.beginPath();

          if (isFrequencyView) {
            var left = Math.round(68 * pixelRatio);
            var right = width - Math.round(24 * pixelRatio);
            var top = Math.round(115 * pixelRatio);
            var bottom = height - Math.round(52 * pixelRatio);
            var x = left + Math.log(frequency / minFrequency) /
              Math.log(maxFrequency / minFrequency) * (right - left);
            markerContext.moveTo(x, top);
            markerContext.lineTo(x, bottom);
          } else {
            var y = Math.log(maxFrequency / frequency) /
              Math.log(maxFrequency / minFrequency) * (height - 1);
            var scaleWidth = Math.round(72 * pixelRatio);
            markerContext.moveTo(scaleWidth, y);
            markerContext.lineTo(width, y);
          }

          markerContext.stroke();

          if (isFrequencyView) {
            var frequencyLabel = frequency >= 1000
              ? (frequency / 1000).toFixed(1) + ' kHz'
              : Math.round(frequency) + ' Hz';
            var labelY = top + 12 * pixelRatio;
            markerContext.setLineDash([]);
            markerContext.font = '600 ' + (12 * pixelRatio) + 'px Arial, sans-serif';
            markerContext.textAlign = 'center';
            markerContext.textBaseline = 'middle';
            var labelWidth = markerContext.measureText(frequencyLabel).width;
            var labelX = Math.max(left + labelWidth / 2 + 5 * pixelRatio,
              Math.min(right - labelWidth / 2 - 5 * pixelRatio, x));
            markerContext.fillStyle = 'rgba(33, 33, 33, .92)';
            markerContext.fillRect(labelX - labelWidth / 2 - 5 * pixelRatio,
              labelY - 10 * pixelRatio, labelWidth + 10 * pixelRatio, 20 * pixelRatio);
            markerContext.fillStyle = markerColor;
            markerContext.fillText(frequencyLabel, labelX, labelY);
          } else {
            var frequencyLabel = frequency >= 1000
              ? (frequency / 1000).toFixed(1) + ' kHz'
              : Math.round(frequency) + ' Hz';
            var labelX = Math.round(78 * pixelRatio);
            var labelY = Math.max(12 * pixelRatio, Math.min(height - 12 * pixelRatio, y - 10 * pixelRatio));
            markerContext.setLineDash([]);
            markerContext.font = (11 * pixelRatio) + 'px Arial, sans-serif';
            markerContext.textAlign = 'left';
            markerContext.textBaseline = 'middle';
            markerContext.fillStyle = 'rgba(33, 33, 33, .92)';
            var labelWidth = markerContext.measureText(frequencyLabel).width;
            markerContext.fillRect(labelX - 4 * pixelRatio, labelY - 9 * pixelRatio, labelWidth + 8 * pixelRatio, 18 * pixelRatio);
            markerContext.fillStyle = markerColor;
            markerContext.fillText(frequencyLabel, labelX, labelY);
          }

          markerContext.restore();
        }

        function drawFrequencySpectrum(width, height, minFrequency, maxFrequency, binWidth) {
          context.fillStyle = '#333';
          context.fillRect(0, 0, width, height);

          var left = Math.round(68 * pixelRatio);
          var right = width - Math.round(24 * pixelRatio);
          var top = Math.round(115 * pixelRatio);
          var bottom = height - Math.round(52 * pixelRatio);
          var plotWidth = right - left;
          var plotHeight = bottom - top;
          var dbTicks = [
            maxDecibels,
            Math.round(maxDecibels - (maxDecibels - minDecibels) / 3),
            Math.round(maxDecibels - (maxDecibels - minDecibels) * 2 / 3),
            minDecibels
          ];
          var labels = [
            { frequency: 50, text: '50 Hz' },
            { frequency: 100, text: '100 Hz' },
            { frequency: 250, text: '250 Hz' },
            { frequency: 500, text: '500 Hz' },
            { frequency: 1000, text: '1 kHz' },
            { frequency: 2000, text: '2 kHz' },
            { frequency: 4000, text: '4 kHz' },
            { frequency: 8000, text: '8 kHz' },
            { frequency: 16000, text: '16 kHz' }
          ];

          context.font = (12 * pixelRatio) + 'px Arial, sans-serif';
          context.textAlign = 'center';
          context.textBaseline = 'top';
          labels.forEach(function(label) {
            if (label.frequency < minFrequency || label.frequency > maxFrequency) return;
            var x = left + Math.log(label.frequency / minFrequency) /
              Math.log(maxFrequency / minFrequency) * plotWidth;
            context.strokeStyle = 'rgba(221, 221, 221, .2)';
            context.beginPath();
            context.moveTo(x, top);
            context.lineTo(x, bottom);
            context.stroke();
            context.fillStyle = '#DDD';
            context.fillText(label.text, x, bottom + 12 * pixelRatio);
          });

          context.font = (11 * pixelRatio) + 'px Arial, sans-serif';
          context.textAlign = 'right';
          context.textBaseline = 'middle';
          dbTicks.forEach(function(decibels) {
            var y = bottom - (decibels - minDecibels) /
              (maxDecibels - minDecibels) * plotHeight;
            context.strokeStyle = 'rgba(221, 221, 221, .2)';
            context.beginPath();
            context.moveTo(left, y);
            context.lineTo(right, y);
            context.stroke();
            context.fillStyle = '#DDD';
            context.fillText(decibels + ' dB', left - 8 * pixelRatio, y);
          });

          context.strokeStyle = 'rgba(221, 221, 221, .65)';
          context.beginPath();
          context.moveTo(left, top);
          context.lineTo(left, bottom);
          context.lineTo(right, bottom);
          context.stroke();

          var gradient = context.createLinearGradient(0, top, 0, bottom);
          gradient.addColorStop(0, 'rgba(221, 221, 221, .75)');
          gradient.addColorStop(1, 'rgba(221, 221, 221, .05)');
          context.beginPath();
          var hasPoint = false;
          for (var bin = 1; bin < frequencyData.length; bin++) {
            var frequency = bin * binWidth;
            if (frequency < minFrequency || frequency > maxFrequency) continue;
            var x = left + Math.log(frequency / minFrequency) /
              Math.log(maxFrequency / minFrequency) * plotWidth;
            var smoothedLevel = 0;
            var smoothingWeight = 0;
            for (var smoothingOffset = -3; smoothingOffset <= 3; smoothingOffset++) {
              var neighborBin = bin + smoothingOffset;
              var neighborFrequency = neighborBin * binWidth;
              if (neighborBin < 1 || neighborFrequency < minFrequency || neighborFrequency > maxFrequency) continue;
              var weight = 4 - Math.abs(smoothingOffset);
              smoothedLevel += frequencyData[neighborBin] * weight;
              smoothingWeight += weight;
            }
            var y = bottom - (smoothedLevel / smoothingWeight / 255) * plotHeight;
            if (!hasPoint) {
              context.moveTo(x, y);
              hasPoint = true;
            } else {
              context.lineTo(x, y);
            }
          }
          context.strokeStyle = '#DDD';
          context.lineWidth = Math.max(1.5, 2 * pixelRatio);
          context.stroke();
          context.lineTo(right, bottom);
          context.lineTo(left, bottom);
          context.closePath();
          context.fillStyle = gradient;
          context.fill();

          context.fillStyle = '#DDD';
          context.font = '600 ' + (15 * pixelRatio) + 'px Arial, sans-serif';
          context.textAlign = 'left';
          context.textBaseline = 'top';
          context.fillText('Espectro de frecuencias', left, Math.round(78 * pixelRatio));
          context.font = (11 * pixelRatio) + 'px Arial, sans-serif';
          context.fillStyle = 'rgba(221, 221, 221, .75)';
          context.fillText('Nivel (dB)', left, top - 18 * pixelRatio);
          context.textAlign = 'center';
          context.fillText('Frecuencia (Hz)', left + plotWidth / 2, bottom + 32 * pixelRatio);
        }

        function drawFrequencyScale(targetContext, height, maxFrequency, minFrequency) {
          var scaleWidth = Math.round(72 * pixelRatio);
          var labels = [
            { frequency: 16000, text: '16 kHz' },
            { frequency: 8000, text: '8 kHz' },
            { frequency: 4000, text: '4 kHz' },
            { frequency: 2000, text: '2 kHz' },
            { frequency: 1000, text: '1 kHz' },
            { frequency: 500, text: '500 Hz' },
            { frequency: 250, text: '250 Hz' },
            { frequency: 125, text: '125 Hz' },
            { frequency: 60, text: '60 Hz' }
          ];
          targetContext.fillStyle = 'rgba(33, 33, 33, .9)';
          targetContext.fillRect(0, 0, scaleWidth, height);
          targetContext.font = (11 * pixelRatio) + 'px Arial, sans-serif';
          targetContext.textAlign = 'left';
          targetContext.textBaseline = 'middle';

          labels.forEach(function(label) {
            if (label.frequency > maxFrequency || label.frequency < minFrequency) return;
            var y = Math.log(maxFrequency / label.frequency) /
              Math.log(maxFrequency / minFrequency) * (height - 1);
            targetContext.strokeStyle = 'rgba(221, 221, 221, .35)';
            targetContext.beginPath();
            targetContext.moveTo(scaleWidth - 7 * pixelRatio, y);
            targetContext.lineTo(scaleWidth, y);
            targetContext.stroke();
            targetContext.fillStyle = '#DDD';
            targetContext.fillText(label.text, 5 * pixelRatio, y);
          });
          targetContext.fillStyle = 'rgba(221, 221, 221, .45)';
          targetContext.fillRect(scaleWidth - 1, 0, Math.max(1, pixelRatio), height);
        }

        function updateFrequencyReadout(frequency, level) {
          var now = performance.now();
          if (now - lastFrequencyUpdate < 150) return;
          lastFrequencyUpdate = now;
          if (level < 35) {
            frequencyReadout.textContent = 'Frecuencia predominante: sin señal clara';
          } else {
            var value = frequency >= 1000
              ? (frequency / 1000).toFixed(1) + ' kHz'
              : Math.round(frequency) + ' Hz';
            frequencyReadout.textContent = 'Frecuencia predominante: ' + value;
          }
        }

        function stopMicrophone() {
          isRunning = false;
          button.setAttribute('aria-pressed', 'false');
          button.setAttribute('aria-label', 'Activar micrófono');
          button.title = 'Activar micrófono';
          if (animationFrame !== null) cancelAnimationFrame(animationFrame);
          animationFrame = null;
          if (microphoneStream) {
            microphoneStream.getTracks().forEach(function(track) { track.stop(); });
            microphoneStream = null;
          }
          if (audioContext) {
            audioContext.close();
            audioContext = null;
          }
          analyser = null;
          frequencyData = null;
          resizeCanvas();
          context.fillStyle = '#333';
          context.fillRect(0, 0, canvas.width, canvas.height);
          timeContext.fillStyle = '#333';
          timeContext.fillRect(0, 0, timeCanvas.width, timeCanvas.height);
          markerContext.clearRect(0, 0, markerCanvas.width, markerCanvas.height);
          frequencyReadout.textContent = 'Frecuencia predominante: --';
          status.textContent = 'Micrófono detenido. Pulsa el botón para continuar.';
        }

        async function startMicrophone() {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            status.textContent = 'Este navegador no permite acceder al micrófono. Abre la página en HTTPS o localhost.';
            return;
          }

          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
          status.textContent = 'Esperando permiso para usar el micrófono…';
          try {
            microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) throw new Error('Web Audio no está disponible en este navegador.');
            audioContext = new AudioContextClass();
            await audioContext.resume();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.72;
            analyser.minDecibels = minDecibels;
            analyser.maxDecibels = maxDecibels;
            audioContext.createMediaStreamSource(microphoneStream).connect(analyser);
            frequencyData = new Uint8Array(analyser.frequencyBinCount);
            resizeCanvas();
            isRunning = true;
            button.setAttribute('aria-pressed', 'true');
            button.setAttribute('aria-label', 'Detener micrófono');
            button.title = 'Detener micrófono';
            status.textContent = 'Escuchando…';
            drawSpectrogram();
          } catch (error) {
            if (microphoneStream) {
              microphoneStream.getTracks().forEach(function(track) { track.stop(); });
              microphoneStream = null;
            }
            if (audioContext) {
              audioContext.close();
              audioContext = null;
            }
            status.textContent = error.name === 'NotAllowedError'
              ? 'Permiso denegado. Autoriza el micrófono en el navegador e inténtalo de nuevo.'
              : 'No se pudo iniciar el micrófono: ' + error.message;
          } finally {
            button.disabled = false;
            button.removeAttribute('aria-busy');
          }
        }

        button.addEventListener('click', function() {
          if (isRunning) stopMicrophone();
          else startMicrophone();
        });
        modeButton.addEventListener('click', function() {
          var wasFrequencyView = isFrequencyView;
          isFrequencyView = !isFrequencyView;
          modeButton.textContent = isFrequencyView ? 'Vista: frecuencia' : 'Vista: tiempo';
          modeButton.setAttribute('aria-pressed', String(isFrequencyView));
          levelLegend.hidden = isFrequencyView;
          if (wasFrequencyView) {
            context.drawImage(timeCanvas, 0, 0);
            markerContext.clearRect(0, 0, markerCanvas.width, markerCanvas.height);
          }
        });
        settingsMenuButton.addEventListener('click', function() {
          var isOpen = settingsMenuButton.getAttribute('aria-expanded') === 'true';
          settingsMenuButton.setAttribute('aria-expanded', String(!isOpen));
          settingsMenuButton.setAttribute('aria-label', isOpen ? 'Abrir opciones de vista y escala' : 'Cerrar opciones de vista y escala');
          settingsMenu.hidden = isOpen;
        });
        minDbRange.addEventListener('input', function() {
          minDecibels = Number(minDbRange.value);
          updateDecibelScale();
        });
        document.addEventListener('keydown', function(event) {
          if (event.key === 'Escape' && !settingsMenu.hidden) {
            settingsMenu.hidden = true;
            settingsMenuButton.setAttribute('aria-expanded', 'false');
            settingsMenuButton.setAttribute('aria-label', 'Abrir opciones de vista y escala');
            settingsMenuButton.focus();
          }
        });
        document.addEventListener('click', function(event) {
          if (!settingsMenu.hidden && !settingsMenu.contains(event.target) && event.target !== settingsMenuButton) {
            settingsMenu.hidden = true;
            settingsMenuButton.setAttribute('aria-expanded', 'false');
            settingsMenuButton.setAttribute('aria-label', 'Abrir opciones de vista y escala');
          }
        });
        window.addEventListener('resize', resizeCanvas);
        updateDecibelScale();
        drawLevelLegend();
        resizeCanvas();
      })(); 
    </script>
  </body>
</html>
